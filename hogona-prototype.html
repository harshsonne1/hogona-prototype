<title>Hogona Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Noto+Sans+Kannada:wght@500;700&display=swap">
<style>
/* Layout: one phone runs the journey as map + bottom sheet; stage list sits left, the design note for the current screen sits right. Single light look by choice. */
:root{
  color-scheme:light;
  --bg:#FFFFFF;
  --ink:#11111F;
  --ink2:#5B5B6E;
  --hair:#E6E6EE;
  --fill:#F3F3F7;
  --brand:#C2127E;       /* tabebuia pink, primary actions and links */
  --brand-tint:#FCEAF5;
  --bus:#1479D1;         /* BMTC blue */
  --metro:#6E2A96;       /* Namma Metro Purple Line */
  --mint:#D6F5E3; --mint-ink:#0B5D36;
  --sun:#FFE27A; --sun-ink:#4A3A00;
  --page:#F1F1F5;
  --font:"Figtree","Helvetica Neue",Arial,sans-serif;
  --kn:"Noto Sans Kannada","Kannada Sangam MN",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left;padding:0}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
p,h1,h2{margin:0}
.kn{font-family:var(--kn);font-weight:500}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- page shell ---------- */
.shell{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 390px minmax(0,1fr);gap:40px;align-items:start}
.side-h{font-weight:800;font-size:28px;letter-spacing:-0.02em;line-height:1.1;margin:8px 0 6px}
.lede{color:var(--ink2);max-width:36ch;margin-bottom:18px}
.stages{display:flex;flex-direction:column;gap:2px}
.stages button{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:9px 12px;border-radius:10px;align-items:baseline}
.stages b{font-weight:700}
.stages span{color:var(--ink2);font-size:14px}
.stages button:hover{background:#E7E7EE}
.stages button[aria-current="true"]{background:var(--ink);color:#fff}
.stages button[aria-current="true"] span{color:#C9C9D6}
.note{background:var(--bg);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;margin-top:8px}
.eyebrow{font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.note h2{font-weight:800;font-size:24px;letter-spacing:-0.02em;line-height:1.15;text-wrap:balance}
.note dl{margin:0;display:flex;flex-direction:column;gap:14px}
.note dt{font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.note dd{margin:3px 0 0}
.pager{display:flex;gap:8px}
.pager button{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;height:44px;border-radius:999px;background:var(--fill);font-weight:700}
.pager button:disabled{opacity:.4;cursor:default}

/* ---------- phone ---------- */
.phone{width:390px;height:812px;border-radius:48px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 10px #16161F,0 24px 50px rgba(17,17,31,.18)}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.sb{height:50px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 8px;font-weight:700;font-size:16px;position:relative;z-index:3}
.sb svg{height:13px;width:auto;fill:var(--ink)}
.sb.over{position:absolute;inset:0 0 auto}
.body{flex:1;min-height:0;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:16px}
.h1{font-weight:800;font-size:27px;letter-spacing:-0.022em;line-height:1.14;text-wrap:balance}
.h2{font-weight:800;font-size:18px;letter-spacing:-0.01em}
.sub{color:var(--ink2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;font-size:17px}
.btn:active{filter:brightness(.92)}
.link{display:block;width:100%;text-align:center;padding:8px;color:var(--brand);font-weight:700}
.dock{flex:none;padding:12px 20px 22px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.back{flex:none;align-self:flex-start;width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;box-shadow:0 2px 8px rgba(17,17,31,.16)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair);width:100%}
.rows .row:last-child{border-bottom:0}
.row b{font-weight:700;display:block}
.row .sub{font-size:14px;display:block}
.ico{width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-weight:800}
.ico.brand{background:var(--brand-tint);color:var(--brand)}
.ico.done{background:var(--mint);color:var(--mint-ink)}
.end{text-align:right;font-weight:700;white-space:nowrap}
.end small{display:block;font-weight:500;font-size:13px;color:var(--ink2)}
.rb{display:inline-grid;place-items:center;white-space:nowrap;min-width:62px;height:30px;padding:0 8px;border-radius:8px;color:#fff;font-weight:800;font-size:15px;letter-spacing:-0.01em}
.rb.bus{background:var(--bus)} .rb.metro{background:var(--metro)}
.row.dep{grid-template-columns:auto minmax(0,1fr) auto}
.row.dep .rb{min-width:72px}

/* trust language: live is solid, scheduled is dashed */
.live,.sched{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;border-radius:999px;padding:2px 8px;white-space:nowrap;vertical-align:middle}
.live{background:var(--mint);color:var(--mint-ink)}
.live i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
.sched{border:1.5px dashed #9A9AAB;color:var(--ink2);padding:1px 8px}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}

.banner{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:13px 14px;background:var(--mint);color:var(--mint-ink)}
.banner b{display:block;font-weight:700}
.banner.sun{background:var(--sun);color:var(--sun-ink)}
.banner.big{padding:16px}
.banner.big b{font-size:19px;font-weight:800;letter-spacing:-0.01em}

/* home */
.top{display:flex;justify-content:space-between;align-items:center}
.wm{font-weight:900;font-size:20px;letter-spacing:-0.02em}
.wm .kn{font-weight:700;color:var(--brand);margin-right:6px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;font-weight:800}
.search{display:flex;align-items:center;gap:10px;width:100%;height:56px;border-radius:14px;background:var(--fill);padding:0 8px 0 16px;font-weight:600;font-size:17px}
.search .q{flex:1;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px;border-radius:999px;background:var(--bg);font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(17,17,31,.12)}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hair);padding:8px 8px 20px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink2)}
.tabs button[aria-current="true"]{color:var(--brand)}

/* map + sheet */
.map{flex:none;height:300px;background:#E9EDF1;position:relative}
.map svg{display:block;width:100%;height:100%}
.map-ui{position:absolute;inset:54px 16px auto;display:flex;justify-content:space-between;align-items:center;z-index:2}
.eta{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:var(--bg);font-weight:700;box-shadow:0 2px 8px rgba(17,17,31,.16)}
.eta em{font-style:normal;color:var(--brand)}
.sheet{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:-22px;border-radius:22px 22px 0 0;background:var(--bg);box-shadow:0 -6px 18px rgba(17,17,31,.08);position:relative;z-index:2}
.grab{flex:none;width:40px;height:4px;border-radius:2px;background:#D5D5DF;margin:8px auto 0}
.sheet .body{padding-top:12px}
.seg{display:flex;gap:4px}
.seg i{height:4px;border-radius:2px;background:var(--hair)}
.seg i.done{background:var(--ink)} .seg i.now{background:var(--brand)}
.step{font-weight:700;font-size:13px;color:var(--ink2)}
.head{display:flex;flex-direction:column;gap:4px}

/* trip options */
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--hair)}
.opt.sel{border:2px solid var(--brand);background:var(--brand-tint);padding:13.5px}
.opt b{font-weight:700;display:block}
.opt .sub{font-size:14px;display:block}
.modes{display:flex;gap:4px}
.mode{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
.mode.bus{background:var(--bus)} .mode.metro{background:var(--metro)} .mode.cab{background:var(--fill);color:var(--ink)}
.tag{display:inline-block;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);margin-bottom:1px}
.opts{display:flex;flex-direction:column;gap:8px}
.label{font-weight:700;font-size:13px;color:var(--ink2);margin-bottom:-8px}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:46px 16px minmax(0,1fr);gap:12px}
.tl-t{font-weight:700;font-variant-numeric:tabular-nums}
.tl-r{display:flex;flex-direction:column;align-items:center}
.tl-r i{width:14px;height:14px;border-radius:50%;border:3px solid var(--c,var(--ink));background:var(--bg);flex:none;margin-top:4px}
.tl-r u{flex:1;width:4px;background:var(--c,var(--hair));border-radius:2px;margin:3px 0;min-height:20px}
.tl-r u.dot{background:repeating-linear-gradient(#B5B5C4 0 4px,transparent 4px 9px);width:3px}
.tl-b{padding-bottom:18px}
.tl-b b{font-weight:700;display:block}
.tl-b .sub{display:block;font-size:14px}
.pay{margin-top:8px;background:var(--fill);border-radius:10px;padding:9px 12px;font-size:14px}

/* destination board, as on the front of a BMTC bus */
.led{background:#15151C;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;color:#FFB321}
.led .n{font-weight:900;font-size:34px;letter-spacing:-0.01em;line-height:1}
.led .d{display:flex;flex-direction:column;line-height:1.2;font-weight:800;font-size:17px;letter-spacing:.03em;text-transform:uppercase}
.led .d .kn{font-weight:700;font-size:17px;letter-spacing:0}
.cap{font-size:13px;color:var(--ink2);margin-top:-10px}

/* stops */
.stops{display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:14px;align-items:center;min-height:32px;position:relative;color:var(--ink2)}
.stop::before{content:"";position:absolute;left:5px;top:-50%;height:100%;width:4px;background:var(--hair)}
.stop:first-child::before{display:none}
.stop i{width:14px;height:14px;border-radius:50%;border:3px solid #C4C4D2;background:var(--bg);position:relative;z-index:1}
.stop.past i{background:var(--c);border-color:var(--c)}
.stop.past::before,.stop.here::before{background:var(--c)}
.stop.here{color:var(--ink);font-weight:700}
.stop.here i{border-color:var(--c);box-shadow:0 0 0 4px var(--brand-tint)}
.stop.last{color:var(--ink);font-weight:700}
.stop small{font-weight:700;font-size:12px;color:var(--brand)}

/* arrive */
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-top:10px}
.tick{width:56px;height:56px;border-radius:50%;background:var(--mint);color:var(--mint-ink);display:grid;place-items:center}
.tick .ic{width:28px;height:28px;stroke-width:2.6}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{height:46px;border-radius:999px;border:1.5px solid var(--hair);text-align:center;font-weight:700}
.feel button[aria-pressed="true"]{border:2px solid var(--brand);background:var(--brand-tint);color:var(--brand)}

@media (max-width:1100px){
  .shell{grid-template-columns:minmax(0,1fr);justify-items:center;gap:20px}
  .side{width:100%;max-width:430px}
  .lede{max-width:none;margin-bottom:12px}
  .stages{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .stages button{display:block;flex:none;padding:8px 14px;background:var(--bg);border-radius:999px}
  .stages span{display:none}
  .phone{width:100%;max-width:430px;height:780px;border-radius:32px;box-shadow:0 0 0 1px var(--hair)}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<div class="shell">
  <aside class="side">
    <p class="eyebrow">Core journey prototype</p>
    <h1 class="side-h">Hogona</h1>
    <p class="lede">Ananya rides from Marathahalli to her office in Indiranagar: one bus, one metro, 49 minutes.</p>
    <nav class="stages" id="stages" aria-label="Journey stages"></nav>
  </aside>
  <main class="phone" id="phone"></main>
  <aside class="side"><div class="note" id="note"></div></aside>
</div>

<script>
const ic = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;
const live = `<span class="live"><i></i>Live</span>`;
const sched = `<span class="sched">Scheduled</span>`;
const sb = (t, over) => `<div class="sb ${over?'over':''}"><span>${t}</span><svg viewBox="0 0 66 13" aria-hidden="true"><rect x="0" y="8" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/><path d="M24 5a9 9 0 0 1 13 0l-1.6 1.700a6.6 6.6 0 0 0-9.8 0zM27 8a5 5 0 0 1 7 0l-3.5 3.600z"/><rect x="43" y="1" width="20" height="11" rx="3.2"/><rect x="64" y="4.5" width="2" height="4" rx="1"/></svg></div>`;

const S = { screen:'home', bus:'500-D', busMins:6, eta:'9:31', late:0, liveBus:true, ride:0, saved:false, feel:null };
let timer = null;

const BUS = {stops:['Marathahalli Bridge','Doddanekundi','Karthik Nagar','Mahadevapura','B Narayanapura','KR Puram Railway Station','Tin Factory'],
             pts:[[322,190],[331,173],[329,155],[319,139],[303,127],[281,119],[255,114]]};
const METRO = {stops:['Benniganahalli','Baiyappanahalli','Swami Vivekananda Road','Indiranagar'],
               pts:[[232,110],[184,122],[134,136],[86,148]]};

const STAGES = [
  {id:'home',     stage:'Discover', q:'How do I get there?',        a:'Saved places sit above the fold, so a repeat trip is one tap. Nearby departures show before any search, each marked live or scheduled.', who:'Regular riders (one-tap repeat), hesitant riders (sees that buses are actually coming)'},
  {id:'decide',   stage:'Decide',   q:'Which route is best?',       a:'One trip is pre-selected with the reason it was picked. Two alternatives sit below it. The cab is listed in the same format so the comparison is direct, including when the cab is the better call.', who:'Hesitant riders'},
  {id:'preview',  stage:'Prepare',  q:'When should I leave?',       a:'Leave-by time leads. Every leg shows what to pay and how, since payment happens outside the app. The steps are saved for use without signal.', who:'Newcomers, hesitant riders'},
  {id:'walk',     stage:'Walk',     q:'Where exactly is the stop?', a:'Names the side of the road and a landmark, because a stop on the wrong side sends the bus the wrong way.', who:'Newcomers'},
  {id:'wait',     stage:'Wait',     q:'When will it arrive?',       a:'The headline is the answer. Live and scheduled times look different everywhere. The bus is shown as its real destination board. "I missed it" is always in reach.', who:'Regular riders, hesitant riders'},
  {id:'board',    stage:'Board',    q:'Is this the right bus?',     a:'Two checks against what is physically on the bus, in Kannada and English. The rider confirms boarding; the app does not pretend to detect it.', who:'Newcomers, hesitant riders'},
  {id:'ride',     stage:'Ride',     q:'When do I get off?',         a:'Stops left counts down. One stop before, a yellow alert takes over and the phone buzzes, so the rider can stop watching the screen.', who:'Newcomers'},
  {id:'transfer', stage:'Transfer', q:'Where do I go next?',        a:'Three numbered steps: walk, ticket, platform direction. The train time is marked scheduled because no live feed is assumed.', who:'Newcomers'},
  {id:'metro',    stage:'Ride',     q:'When do I get off?',         a:'Same pattern as the bus so nothing has to be relearned, with the door side added.', who:'All riders'},
  {id:'arrive',   stage:'Arrive',   q:'Was it worth it?',           a:'A plain recap of time and money against a cab. Saving the trip makes tomorrow one tap. No points, badges or streaks.', who:'Hesitant riders (value), regular riders (repeat)'},
  {id:'recover',  stage:'Recover',  q:'What if I miss it?',         a:'Reached from any journey screen. Leads with reassurance, then the best next option with the new arrival time, then honest fallbacks including an auto.', who:'All riders', branch:true}
];

/* ---------- map ---------- */
const path = pts => pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
function routeMap(pos, focus){
  const dim = k => focus && focus!==k ? .35 : 1;
  const A=BUS.pts[0], T=BUS.pts[6], M=METRO.pts[0], I=METRO.pts[3];
  return `<svg viewBox="0 0 390 260" preserveAspectRatio="xMidYMin slice" role="img" aria-label="Route map from Marathahalli to Indiranagar">
    <rect width="390" height="260" fill="#E9EDF1"/>

function rideView(o){
  const n = o.line.stops.length-1, left = n-S.ride;
  const list = o.line.stops.map((s,i)=>`<div class="stop ${i<S.ride?'past':i===S.ride?'here':''} ${i===n?'last':''}" style="--c:${o.color}"><i></i><span>${s}</span>${i===n?'<small>Get off here</small>':''}</div>`).join('');
  const title = left===0 ? `This is ${o.off}. Get off now.` : left===1 ? `Get off at the next stop` : `Get off in ${left} stops`;
  const sub = left>1 ? `at ${o.off}` : '';
  const note = left<=1
    ? `<div class="banner sun big">${ic('bell')}<span><b>${o.off} is ${left?'next':'here'}</b>${o.hint}</span></div>`
    : `<div class="banner">${ic('bell')}<span><b>You can put your phone away</b>We'll buzz you one stop before ${o.off}.</span></div>`;
  return `<div class="scr">${sb(o.time,1)}<div class="map" style="height:240px">${routeMap(o.line.pts[S.ride],o.focus)}${mapUi()}</div>
    <div class="sheet">${sheetHead(o.leg,o.step,title,sub)}${note}<div class="stops">${list}</div></div>${dock(`I got off at ${o.off}`,o.next,wrong())}</div></div>`;
}

const phone = document.getElementById('phone'), stagesEl = document.getElementById('stages'), noteEl = document.getElementById('note');

function render(){
  const keep = phone.querySelector('.sheet .body, .scr > .body'), y = keep ? keep.scrollTop : 0, same = phone.dataset.s===S.screen;
  phone.innerHTML = V[S.screen](); phone.dataset.s = S.screen;
  if(same){ const b = phone.querySelector('.sheet .body, .scr > .body'); if(b) b.scrollTop = y; }
  const st = STAGES.find(s=>s.id===S.screen);
  stagesEl.innerHTML = STAGES.map(s=>`<button data-go="${s.id}" aria-current="${s.id===S.screen}"><b>${s.stage}</b><span>${s.q}</span></button>`).join('');
  const main = STAGES.filter(s=>!s.branch), mi = main.findIndex(s=>s.id===S.screen);
  noteEl.innerHTML = `<span class="eyebrow">${st.stage} · the rider asks</span><h2>${st.q}</h2>
    <dl><div><dt>How the screen answers</dt><dd>${st.a}</dd></div><div><dt>Matters most to</dt><dd>${st.who}</dd></div></dl>
    <div class="pager"><button data-go="${mi>0?main[mi-1].id:''}" ${mi>0?'':'disabled'}>Back</button><button data-go="${st.branch?'wait':mi<main.length-1?main[mi+1].id:''}" ${st.branch||mi<main.length-1?'':'disabled'}>${st.branch?'Resume trip':'Next'} ${ic('arrow')}</button></div>`;
}

function go(id, keepHash){
  if(!V[id]) return;
  clearInterval(timer);
  if(id==='home'){ Object.assign(S,{bus:'500-D',busMins:6,eta:'9:31',late:0,liveBus:true,saved:false,feel:null}); }
  S.screen = id; S.ride = 0;
  render();
  if(id==='ride'||id==='metro'){
    const n = (id==='ride'?BUS:METRO).stops.length-1;
    timer = setInterval(()=>{ if(S.ride<n){ S.ride++; render(); } else clearInterval(timer); }, 1800);
  }
  if(!keepHash){ try{ history.replaceState(null,'','#'+id); }catch(e){} }
}

document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]'); if(g){ if(g.dataset.go) go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  if(a){
    const k = a.dataset.act;
    if(k==='next'){ Object.assign(S,{bus:'500-D',busMins:9,eta:'9:40',late:9,liveBus:true}); go('wait'); }
    if(k==='alt'){ Object.assign(S,{bus:'500-CA',busMins:4,eta:'9:35',late:4,liveBus:false}); go('wait'); }
    if(k==='auto'){ Object.assign(S,{eta:'9:28',late:0}); go('transfer'); }
    if(k==='save'){ S.saved = true; render(); }
    return;
  }
  const f = e.target.closest('[data-feel]'); if(f){ S.feel = f.dataset.feel; render(); }
