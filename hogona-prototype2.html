<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hogona Prototype 2 · Modern Vernacular</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800&family=Noto+Sans+Kannada:wght@500;700&display=swap">
<style>
/* Direction 1, "Modern Vernacular": cream ground, marigold, brick red, forest green. Flat screen-print illustration with grain.
   BMTC blue and Metro purple are kept only where the rider matches them against real signs (route badges, map lines). */
:root{
  color-scheme:light;
  --cream:#FBF4E8;      /* phone ground */
  --bg:#FFFDF8;         /* cards and sheets */
  --ink:#1F1A14;
  --ink2:#6B6157;
  --hair:#EADFCC;
  --fill:#F4EAD9;
  --brand:#B03A26;      /* brick red: primary actions */
  --brand-tint:#F7E0D6;
  --forest:#2F4A35;
  --mari:#F2B45E;
  --mari-tint:#FCEBD0;
  --bus:#1C6FC0;
  --metro:#6E2A96;
  --mint:#DCE8D3; --mint-ink:#2F4A35;
  --sun:#F2B45E; --sun-ink:#3A2A08;
  --page:#EFE6D6;
  --font:"Figtree","Helvetica Neue",Arial,sans-serif;
  --disp:"Rubik","Figtree",sans-serif;
  --kn:"Noto Sans Kannada","Kannada Sangam MN",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;padding:24px 16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left;padding:0}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
p,h1,h2{margin:0}
a{color:var(--brand);font-weight:700}
.kn{font-family:var(--kn);font-weight:500}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- page shell ---------- */
.shell{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 390px minmax(0,1fr);gap:40px;align-items:start}
.side-h{font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:-0.01em;line-height:1.1;margin:8px 0 6px}
.lede{color:var(--ink2);max-width:36ch;margin-bottom:12px}
.toggle{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin:4px 0 14px;cursor:pointer}
.toggle input{accent-color:var(--brand);width:16px;height:16px}
.stages{display:flex;flex-direction:column;gap:2px}
.stages button{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:9px 12px;border-radius:10px;align-items:baseline}
.stages b{font-weight:700}
.stages span{color:var(--ink2);font-size:14px}
.stages button:hover{background:#E6DAC5}
.stages button[aria-current="true"]{background:var(--forest);color:#fff}
.stages button[aria-current="true"] span{color:#C9D6C9}
.note{background:var(--bg);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;margin-top:8px}
.eyebrow{font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.note h2{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:-0.01em;line-height:1.15;text-wrap:balance}
.note dl{margin:0;display:flex;flex-direction:column;gap:14px}
.note dt{font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.note dd{margin:3px 0 0}
.note .new{background:var(--mari-tint);border-radius:12px;padding:12px 14px}
.note .new dt{color:#8A5A12}
.ill-list{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.ill-list b{display:inline-block;min-width:34px;font-weight:800;color:var(--brand)}
.pager{display:flex;gap:8px}
.pager button{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;height:44px;border-radius:999px;background:var(--fill);font-weight:700}
.pager button:disabled{opacity:.4;cursor:default}

/* ---------- illustration slots ---------- */
.art{position:relative;margin:0;flex:none}
.art .ph,.art .ph svg{display:block;width:100%;height:100%}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.art.has .ph{visibility:hidden}
.art figcaption{display:none;position:absolute;left:2px;top:2px;z-index:2;background:var(--ink);color:#fff;font:800 10px/1 var(--font);padding:3px 5px;border-radius:5px;letter-spacing:.02em}
.labels .art{outline:1.5px dashed rgba(176,58,38,.55);outline-offset:-1px;border-radius:6px}
.labels .art figcaption{display:block}
.labels .burst .art{outline:0}
.labels .burst .art figcaption{left:50%;top:auto;bottom:4px;transform:translateX(-50%)}
.labels .burst.cap-hi .art figcaption{bottom:30%}
.art.sm{width:46px;height:46px}
.art.i40{width:40px;height:40px}
.art.veh{width:64px;height:40px}
.art.strip{width:100%;height:96px}

/* character bursting out of a marigold circle, as in the reference */
.burst{position:relative;width:var(--s);height:var(--s);flex:none;clip-path:inset(-45% -10% 0 -10% round 0 0 50% 50%)}
.burst::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--mari)}
.burst .art{position:absolute;left:-6%;top:-20%;width:112%;height:112%}

/* ---------- phone ---------- */
.phone{width:390px;height:812px;border-radius:48px;overflow:hidden;background:var(--cream);display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 10px #241C14,0 24px 50px rgba(60,40,10,.22)}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.sb{height:50px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 8px;font-weight:700;font-size:16px;position:relative;z-index:3}
.sb svg{height:13px;width:auto;fill:var(--ink)}
.sb.over{position:absolute;inset:0 0 auto}
.body{flex:1;min-height:0;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:16px}
.body > *{flex-shrink:0}
.h1{font-family:var(--disp);font-weight:700;font-size:27px;letter-spacing:-0.012em;line-height:1.14;text-wrap:balance}
.h2{font-family:var(--disp);font-weight:700;font-size:18px}
.sub{color:var(--ink2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;font-size:17px}
.btn:active{filter:brightness(.92)}
.link{display:block;width:100%;text-align:center;padding:8px;color:var(--brand);font-weight:700}
.dock{flex:none;padding:12px 20px 22px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.scr > .dock{background:var(--cream)}
.back{flex:none;align-self:flex-start;width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;box-shadow:0 2px 8px rgba(60,40,10,.18)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair);width:100%}
.rows .row:last-child{border-bottom:0}
.row b{font-weight:700;display:block}
.row .sub{font-size:14px;display:block}
.ico{width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-weight:800}
.ico.brand{background:var(--brand);color:#fff}
.ico.done{background:var(--mint);color:var(--mint-ink)}
.end{text-align:right;font-weight:700;white-space:nowrap}
.end small{display:block;font-weight:500;font-size:13px;color:var(--ink2)}
.rb{display:inline-grid;place-items:center;white-space:nowrap;min-width:62px;height:30px;padding:0 8px;border-radius:8px;color:#fff;font-weight:800;font-size:15px}
.rb.bus{background:var(--bus)} .rb.metro{background:var(--metro)}
.row.dep{grid-template-columns:auto minmax(0,1fr) auto}
.row.dep .rb{min-width:72px}

.live,.sched{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;border-radius:999px;padding:2px 8px;white-space:nowrap;vertical-align:middle}
.live{background:var(--mint);color:var(--mint-ink)}
.live i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
.sched{border:1.5px dashed #A89A85;color:var(--ink2);padding:1px 8px}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}

.banner{display:flex;gap:12px;align-items:center;border-radius:16px;padding:12px 14px;background:var(--mint);color:var(--mint-ink)}
.banner b{display:block;font-weight:700}
.banner.sun{background:var(--sun);color:var(--sun-ink)}
.banner.big{padding:16px}
.banner.big b{font-family:var(--disp);font-size:19px;font-weight:700}
.card{border-radius:18px;overflow:hidden;background:var(--mari-tint);color:var(--sun-ink)}
.card .art.strip{border-radius:0}
.card-b{padding:12px 14px 14px}
.card-b b{display:block;font-family:var(--disp);font-weight:700;font-size:17px}

/* home */
.avatar{width:40px;height:40px;border-radius:50%;background:var(--bg);color:var(--brand);display:grid;place-items:center;font-weight:800;box-shadow:0 2px 8px rgba(60,40,10,.18)}
.wmchip .kn{font-weight:700;color:var(--brand);margin-right:6px}
.wmchip{font-family:var(--disp);font-weight:800}
.search{display:flex;align-items:center;gap:10px;width:100%;height:58px;border-radius:18px;background:var(--forest);color:var(--mari);padding:0 20px;font-family:var(--disp);font-weight:600;font-size:19px}
.search .q{flex:1;white-space:nowrap}
.search .ic{width:24px;height:24px}
.places{display:grid;grid-template-columns:1.35fr 1fr;gap:10px}
.place{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;background:var(--bg);box-shadow:0 1px 0 var(--hair)}
.place b{display:block;font-family:var(--disp);font-weight:700;font-size:17px}
.place .sub{display:block;font-size:13px}
.place.main{background:var(--brand-tint)}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hair);padding:8px 8px 20px;background:var(--bg)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink2)}
.tabs button[aria-current="true"]{color:var(--brand)}

/* map + sheet */
.map{flex:none;height:300px;background:#F1E7D3;position:relative}
.map > svg{display:block;width:100%;height:100%}
.map-ui{position:absolute;inset:54px 16px auto;display:flex;justify-content:space-between;align-items:center;z-index:2}
.eta{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:var(--bg);font-weight:700;box-shadow:0 2px 8px rgba(60,40,10,.18)}
.eta em{font-style:normal;color:var(--brand)}
.sheet{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:-22px;border-radius:24px 24px 0 0;background:var(--bg);box-shadow:0 -6px 18px rgba(60,40,10,.08);position:relative;z-index:2}
.grab{flex:none;width:40px;height:4px;border-radius:2px;background:#DCCFB8;margin:8px auto 0}
.sheet .body{padding-top:12px}
.seg{display:flex;gap:4px}
.seg i{height:4px;border-radius:2px;background:var(--hair)}
.seg i.done{background:var(--forest)} .seg i.now{background:var(--brand)}
.step{font-weight:700;font-size:13px;color:var(--ink2)}
.head{display:flex;flex-direction:column;gap:4px}
.head.with-art{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.head.with-art > div:first-child{display:flex;flex-direction:column;gap:4px}

/* trip options */
.opt{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:18px;border:1.5px solid var(--hair);background:var(--bg)}
.opt.sel{border:2px solid var(--brand);background:var(--brand-tint);padding:11.5px 13.5px}
.opt b{font-weight:700;display:block}
.opt .sub{font-size:14px;display:block}
.tag{display:inline-block;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:1px}
.opts{display:flex;flex-direction:column;gap:8px}
.label{font-weight:700;font-size:13px;color:var(--ink2);margin-bottom:-8px}

/* ticket, as in the reference: image on top, notches, dashed tear lines */
.ticket{--tk:var(--bg);--around:var(--cream);background:var(--tk);border-radius:22px;box-shadow:0 1px 0 var(--hair),0 8px 24px rgba(60,40,10,.08);flex:none}
.ticket.alt{--tk:#F7EDDC;--around:var(--bg);box-shadow:none}
.tk-img{padding:10px 10px 0}
.tk-img .art{width:100%;height:132px;border-radius:14px;overflow:hidden}
.tk-img.short .art{height:96px}
.tk-pad{padding:14px 18px}
.cut{position:relative;height:0;border-top:2px dashed var(--hair);margin:4px 18px}
.cut::before,.cut::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--around)}
.cut::before{left:-30px} .cut::after{right:-30px}
.tk-foot{display:flex;gap:12px;align-items:center;color:var(--mint-ink)}
.tk-foot b{display:block}
.tk-foot .sub{display:block;font-size:14px}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:44px 16px minmax(0,1fr);gap:12px}
.tl-t{font-weight:700;font-variant-numeric:tabular-nums}
.tl-r{display:flex;flex-direction:column;align-items:center}
.tl-r i{width:14px;height:14px;border-radius:50%;border:3px solid var(--c,var(--ink));background:var(--tk,#fff);flex:none;margin-top:4px}
.tl-r u{flex:1;width:4px;background:var(--c,var(--hair));border-radius:2px;margin:3px 0;min-height:20px}
.tl-r u.dot{background:repeating-linear-gradient(#BFB19B 0 4px,transparent 4px 9px);width:3px}
.tl-b{padding-bottom:16px}
.tl-b b{font-weight:700;display:block}
.tl-b .sub{display:block;font-size:14px}
.pay{margin-top:8px;background:var(--fill);border-radius:10px;padding:9px 12px;font-size:14px}

/* destination board stays literal: the rider matches it against the real bus */
.led{background:#17130F;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;color:#FFB321}
.led .n{font-weight:900;font-size:34px;line-height:1}
.led .d{display:flex;flex-direction:column;line-height:1.2;font-weight:800;font-size:17px;letter-spacing:.03em;text-transform:uppercase}
.led .d .kn{font-weight:700;font-size:17px;letter-spacing:0}
.cap{font-size:13px;color:var(--ink2);margin-top:-10px}

/* stops */
.stops{display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:14px;align-items:center;min-height:32px;position:relative;color:var(--ink2)}
.stop::before{content:"";position:absolute;left:5px;top:-50%;height:100%;width:4px;background:var(--hair)}
.stop:first-child::before{display:none}
.stop i{width:14px;height:14px;border-radius:50%;border:3px solid #CDBFA8;background:var(--bg);position:relative;z-index:1}
.stop.past i{background:var(--c);border-color:var(--c)}
.stop.past::before,.stop.here::before{background:var(--c)}
.stop.here{color:var(--ink);font-weight:700}
.stop.here i{border-color:var(--c);box-shadow:0 0 0 4px var(--mari-tint)}
.stop.last{color:var(--ink);font-weight:700}
.stop small{font-weight:700;font-size:12px;color:var(--brand)}

/* arrive */
.celebrate{flex:none;height:262px;position:relative;background-color:var(--cream);background-image:var(--leaf);background-size:64px 64px;display:flex;justify-content:center;align-items:flex-end}
.celebrate .burst{margin-bottom:-6px}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{height:46px;border-radius:999px;border:1.5px solid var(--hair);text-align:center;font-weight:700}
.feel button[aria-pressed="true"]{border:2px solid var(--brand);background:var(--brand-tint);color:var(--brand)}

@media (max-width:1100px){
  .shell{grid-template-columns:minmax(0,1fr);justify-items:center;gap:20px}
  .side{width:100%;max-width:430px}
  .lede{max-width:none}
  .stages{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .stages button{display:block;flex:none;padding:8px 14px;background:var(--bg);border-radius:999px}
  .stages span{display:none}
  .phone{width:100%;max-width:430px;height:780px;border-radius:32px;box-shadow:0 0 0 1px var(--hair)}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- screen-print grain, applied only inside illustration shapes -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0 0.04  1.5 0 0 0 -0.74" result="s"/>
      <feComposite in="s" in2="SourceGraphic" operator="in" result="g"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="g"/></feMerge>
    </filter>
  </defs>
  <symbol id="i-bus" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="14" rx="3"/><path d="M4 11h16M8 17.5V20M16 17.5V20M8 14.3h.01M16 14.3h.01"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>

</svg>

<div class="shell">
  <aside class="side">
    <p class="eyebrow">Direction 1 · Modern Vernacular</p>
    <h1 class="side-h">Hogona</h1>
    <p class="lede">Ananya rides from Marathahalli to her office in Indiranagar: one bus, one metro, 49 minutes. Rough art marks where each illustration goes. <a href="hogona-prototype.html">Compare with v1</a></p>
    <label class="toggle"><input type="checkbox" id="lbl" checked> Show illustration slots and numbers</label>
    <nav class="stages" id="stages" aria-label="Journey stages"></nav>
  </aside>
  <main class="phone" id="phone"></main>
  <aside class="side"><div class="note" id="note"></div></aside>
</div>

<script>
const ic = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;
const live = `<span class="live"><i></i>Live</span>`;
const sched = `<span class="sched">Scheduled</span>`;
const sb = (t, over) => `<div class="sb ${over?'over':''}"><span>${t}</span><svg viewBox="0 0 66 13" aria-hidden="true"><rect x="0" y="8" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/><path d="M24 5a9 9 0 0 1 13 0l-1.6 1.7a6.6 6.6 0 0 0-9.8 0zM27 8a5 5 0 0 1 7 0l-3.5 3.6z"/><rect x="43" y="1" width="20" height="11" rx="3.2"/><rect x="64" y="4.5" width="2" height="4" rx="1"/></svg></div>`;

/* ---------- illustration list: numbers match the brief; files dropped into illustrations/ replace the rough art ---------- */
const LIST = {
  '01':['ananya-wave','Ananya waving (hero)'], '02':['ananya-walk','Ananya walking with phone'], '03':['ananya-wait','Ananya waiting at the stop'],
  '04':['ananya-ride','Ananya on the bus, headphones'], '05':['ananya-metro','Ananya holding the metro handle'], '06':['ananya-arrive','Ananya with filter coffee'],
  '07':['ananya-shrug','Ananya, calm shrug'], '08':['conductor','BMTC conductor'], '09':['bus','BMTC bus'], '10':['metro','Purple Line train'],
  '11':['auto','Auto rickshaw'], '12':['cab','Cab'], '13':['bus-metro','Bus + metro combo'], '14':['markers','Top-down map marker'],
  '15':['scene-stop','Marathahalli Bridge stop, Kalamandir side'], '16':['scene-skywalk','Tin Factory skywalk to the metro'], '17':['scene-office','100 Feet Road, Indiranagar'],

function rideView(o){
  const n = o.line.stops.length-1, left = n-S.ride, P = o.line.pts, i = S.ride;
  const a = P[i+1] ? P[i] : P[i-1], b = P[i+1] || P[i];
  const ang = Math.atan2(b[1]-a[1], b[0]-a[0]) * 180/Math.PI;
  const list = o.line.stops.map((s,k)=>`<div class="stop ${k<i?'past':k===i?'here':''} ${k===n?'last':''}" style="--c:${o.color}"><i></i><span>${s}</span>${k===n?'<small>Get off here</small>':''}</div>`).join('');
  const title = left===0 ? `This is ${o.off}. Get off now.` : left===1 ? `Get off at the next stop` : `Get off in ${left} stops`;
  const sub = left>1 ? `at ${o.off}` : '';
  const note = left<=1
    ? `<div class="banner sun big">${ic('bell')}<span><b>${o.off} is ${left?'next':'here'}</b>${o.hint}</span></div>`
    : `<div class="banner">${art('22', spot('buzz'),'i40')}<span><b>You can put your phone away</b>We'll buzz you one stop before ${o.off}.</span></div>`;
  return `<div class="scr">${sb(o.time,1)}<div class="map" style="height:230px">${routeMap(P[i],o.focus,{c:o.vc,ang})}${mapUi()}</div>
    <div class="sheet">${sheetHead(o.leg,o.step,title,sub,o.who)}${note}<div class="stops">${list}</div></div>${dock(`I got off at ${o.off}`,o.next,wrong())}</div></div>`;
}

  stagesEl.innerHTML = STAGES.map(s=>`<button data-go="${s.id}" aria-current="${s.id===S.screen}"><b>${s.stage}</b><span>${s.q}</span></button>`).join('');
  const ns = [...new Set([...phone.querySelectorAll('[data-n]')].map(e=>e.dataset.n))];
  const main = STAGES.filter(s=>!s.branch), mi = main.findIndex(s=>s.id===S.screen);
  noteEl.innerHTML = `<span class="eyebrow">${st.stage} · the rider asks</span><h2>${st.q}</h2>
    <dl><div class="new"><dt>What changed in this direction</dt><dd>${st.v2}</dd></div>
    <div><dt>Illustrations on this screen</dt><dd><ul class="ill-list">${ns.map(n=>`<li><b>#${n}</b>${LIST[n][1]}</li>`).join('')}</ul></dd></div>
    <div><dt>How the screen answers</dt><dd>${st.a}</dd></div></dl>
    <div class="pager"><button data-go="${mi>0?main[mi-1].id:''}" ${mi>0?'':'disabled'}>Back</button><button data-go="${st.branch?'wait':mi<main.length-1?main[mi+1].id:''}" ${st.branch||mi<main.length-1?'':'disabled'}>${st.branch?'Resume trip':'Next'} ${ic('arrow')}</button></div>`;
}

function go(id, keepHash){
  if(!V[id]) return;
  clearInterval(timer);
  if(id==='home'){ Object.assign(S,{bus:'500-D',busMins:6,eta:'9:31',late:0,liveBus:true,saved:false,feel:null}); }
  S.screen = id; S.ride = 0;
  render();
  if(id==='ride'||id==='metro'){
    const n = (id==='ride'?BUS:METRO).stops.length-1;
    timer = setInterval(()=>{ if(S.ride<n){ S.ride++; render(); } else clearInterval(timer); }, 1800);
  }
  if(!keepHash){ try{ history.replaceState(null,'','#'+id); }catch(e){} }
}

document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]'); if(g){ if(g.dataset.go) go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  if(a){
    const k = a.dataset.act;
    if(k==='next'){ Object.assign(S,{bus:'500-D',busMins:9,eta:'9:40',late:9,liveBus:true}); go('wait'); }
    if(k==='alt'){ Object.assign(S,{bus:'500-CA',busMins:4,eta:'9:35',late:4,liveBus:false}); go('wait'); }
    if(k==='auto'){ Object.assign(S,{eta:'9:28',late:0}); go('transfer'); }
    if(k==='save'){ S.saved = true; render(); }
    return;
  }
  const f = e.target.closest('[data-feel]'); if(f){ S.feel = f.dataset.feel; render(); }
});
window.addEventListener('hashchange', ()=>go(location.hash.slice(1), true));
go(V[location.hash.slice(1)] ? location.hash.slice(1) : 'home', true);
</script>
</html>
